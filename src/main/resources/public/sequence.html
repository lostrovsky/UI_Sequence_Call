<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>__UI_TITLE__</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            color: #222;
        }
        h1 {
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #666;
            margin-top: 0;
            margin-bottom: 32px;
        }
        button {
            font-size: 16px;
            padding: 12px 24px;
            border: 1px solid #2c3e50;
            background: #2c3e50;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #34495e;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #result {
            margin-top: 24px;
            font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
            font-size: 22px;
        }
        #result.error {
            color: #c0392b;
            font-size: 16px;
        }
        #result.value {
            color: #27ae60;
        }
    </style>
</head>
<body>
    <h1>__UI_TITLE__</h1>
    <p class="subtitle">__UI_SUBTITLE__</p>

    <button id="getBtn">__UI_BUTTON_LABEL__</button>
    <div id="result"></div>

    <script>
        const btn = document.getElementById('getBtn');
        const result = document.getElementById('result');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            result.className = '';
            result.textContent = '...';
            try {
                const res = await fetch('__API_PATH__');
                if (!res.ok) {
                    let detail = '';
                    try {
                        const body = await res.json();
                        if (body.error) detail = ' -- ' + body.error;
                    } catch (_) { /* non-JSON body */ }
                    result.className = 'error';
                    result.textContent = 'Error: HTTP ' + res.status + ' ' + res.statusText + detail;
                    return;
                }
                const data = await res.json();
                result.className = 'value';
                result.textContent = 'Sequence: ' + data.value;
            } catch (e) {
                result.className = 'error';
                result.textContent = 'Error: ' + e.message;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

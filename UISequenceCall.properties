# ============================================================
# UI Sequence Call - configuration
# ============================================================
# Properties file lives next to the jar at runtime (copied to target/
# during 'mvn package'). Override location via --properties-file=<path>
# CLI arg.
# ============================================================

# --- Database connection ---
# Fill these in before first run. The placeholder values below are deliberate
# tokens, not real credentials -- the service will fail to connect until you
# replace them with your actual SQL Server target.
db.url=jdbc:sqlserver://YOUR_DB_HOST:1433;databaseName=YOUR_DB_NAME;trustServerCertificate=true;
db.user=YOUR_DB_USER
db.password=YOUR_DB_PASSWORD

# --- HTTP service ---
# Port the embedded Jetty server listens on. Override at runtime via
# --port=<n> CLI arg.
http.port=8080

# URL paths the service exposes. Override at runtime via --ui-path=<path>
# / --api-path=<path> CLI args. Both must start with '/'. Setting ui.path=/
# would make the form land on the root URL (not recommended -- a misdirected
# hit lands on an action button rather than a status page).
ui.path=/sequence
api.path=/api/next-sequence

# --- UI copy ---
# These customize the visible text on the form. Values are HTML-escaped at
# startup so it's safe to include &, <, >, etc.
ui.title=UI Sequence Call
ui.subtitle=Click the button to fetch the next value from the configured SQL Server sequence.
ui.button.label=Get Next Sequence Number

# --- Sequence target ---
# SQL Server sequence object that the API endpoint queries via
# SELECT NEXT VALUE FOR <schema>.<name>. Both values are validated
# against ^[a-zA-Z_][a-zA-Z0-9_]*$ before being concatenated into SQL.
sequence.schema=dbo
sequence.name=seq_UI_Test
